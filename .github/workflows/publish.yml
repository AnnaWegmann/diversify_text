# Publish to PyPI when a version tag (v*) is pushed.
# Uses PyPI trusted publishing — no API token needed.
# Set up the trusted publisher at:
#   https://pypi.org/manage/project/diversify-text/settings/publishing/

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
