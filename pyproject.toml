[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diversify"
version = "0.1.0"
description = "Generate stylistic paraphrases of texts using local transformer models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch",
    "transformers",
    "huggingface_hub",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
