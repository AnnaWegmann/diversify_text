[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diversify"
version = "0.1.0"
description = "Generate stylistic paraphrases of texts using local transformer models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch",
    "transformers",
    "sentence-transformers",
    "sentencepiece",
    "tiktoken",
    "protobuf",
    "huggingface-hub",
    "tqdm>=4.67.3",
    "mutual-implication-score",
    "pysbd>=0.3.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pandas",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
    "sphinx-copybutton",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
