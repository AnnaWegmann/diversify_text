[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diversify"
version = "0.1.0"
description = "Generate stylistic paraphrases of texts using local transformer models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch",
    "transformers",
    "sentence-transformers",
    "sentencepiece",
    "tiktoken",
    "protobuf",
    "huggingface-hub",
    "pandas",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
